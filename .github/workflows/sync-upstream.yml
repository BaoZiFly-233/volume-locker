name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00
  workflow_dispatch: # 手动触发

# 防止 cron 和手动触发同时运行
concurrency:
  group: sync-upstream
  cancel-in-progress: true

# 本工作流只做「提醒」：不合并、不推送、不打 tag、不发版。
# 汉化版本必须人工合并并逐条处理文案，自动合入会静默带回英文原文。
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/felipecrs/volume-locker.git

      - name: Fetch upstream
        run: |
          git fetch upstream master
          git fetch upstream --tags

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "No new upstream commits, nothing to report"
            exit 0
          fi
          echo "Found ${BEHIND} new upstream commit(s)"
          {
            echo "upstream/master 新增 ${BEHIND} 个提交："
            echo ""
            echo '```'
            git log --oneline --no-decorate HEAD..upstream/master
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 试合并一次，只为判断有没有冲突；结束后无论结果如何都把工作区还原
      - name: Probe merge conflicts
        if: steps.check.outputs.behind != '0'
        id: probe
        run: |
          BEFORE=$(git rev-parse HEAD)
          if git merge upstream/master --no-edit > /tmp/merge.log 2>&1; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "存在冲突，需要手动解决的文件："
              echo ""
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git reset --hard "$BEFORE"
          git clean -fd > /dev/null 2>&1 || true

      - name: Report via issue
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.check.outputs.behind }}
          CONFLICTS: ${{ steps.probe.outputs.conflicts }}
        run: |
          if [ "$CONFLICTS" = "true" ]; then
            RESULT='**有冲突**，需要手动解决'
          else
            RESULT='试合并无冲突，但因为涉及界面文案，仍需人工逐条汉化'
          fi

          {
            echo "上游仓库 felipecrs/volume-locker 有新的提交。"
            echo ""
            echo "- 落后提交数：${BEHIND}"
            echo "- 试合并结果：${RESULT}"
            echo ""
            echo "本工作流只做提醒，不会自动合并，也不会自动打 tag 或发版。"
            echo ""
            echo '```bash'
            echo 'git fetch fork --tags'
            echo 'git fetch origin --tags'
            echo 'git checkout master'
            echo 'git merge fork/master'
            echo 'git merge origin/master'
            echo '# 解决冲突、补全汉化后：git push fork master'
            echo '```'
          } > /tmp/issue-body.md

          # 让这条提醒在 Actions 运行页的 Annotations 里也显出来
          echo "::warning::上游有 ${BEHIND} 个新提交待同步（试合并结果：${RESULT}）"

          TITLE="🔄 上游有新的更新待同步"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" -q .has_issues 2>/dev/null)" != "true" ]; then
            echo "Issues are disabled on ${GITHUB_REPOSITORY}; skipping issue report (see the run summary above)"
            exit 0
          fi

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Open tracking issue #${EXISTING} found, appending a comment"
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md || true
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md || true
          fi
