name: ci

on:
  push:
    branches:
      - master
    tags:
      # 上游原始 tag（v1.2.3）与本仓库汉化 tag（v1.2.3-zh）都应触发发布
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-zh
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # for release
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
      - run: mise run fmt
      - run: mise run lint
      - run: mise run test

      # 版本号替换：tag 形如 v1.2.3（上游）或 v1.2.3-zh（本仓库汉化）。
      # 汉化 tag 的构建产物版本号取基础 semver，-zh 只体现在 tag/Release 名上，
      # 这样 update 检查比较版本时不会把 1.2.3-zh 当成预发布版本。
      - name: Set release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # 剥离前导 v，再剥离 -zh 汉化后缀，得到用于 Cargo 的基础版本号
          version="${tag#v}"
          version="${version%-zh}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' does not yield a valid semver ('$version'). Aborting to prevent malformed Cargo.toml."
            exit 1
          fi
          echo "Tag: $tag -> Cargo version: $version"

          sed -i "s/^version = \"0.0.0-development\"$/version = \"${version}\"/" Cargo.toml Cargo.lock
          grep -q "^version = \"${version}\"$" Cargo.toml
          grep -q "^version = \"${version}\"$" Cargo.lock
          echo "Version set successfully"

      # 在 --frozen 构建前预下载依赖，避免缓存失效时构建失败
      - name: Fetch dependencies
        run: cargo fetch --locked

      - run: mise run build

      # -zh 标签同样发布，产物版本号为基础 semver
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          files: |
            target/release/VolumeLocker.exe
